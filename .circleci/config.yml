version: 2.1

orbs:
  vault: contentful/vault@1.30.5

executors:
  linux-node:
    resource_class: medium
    docker:
      - image: cimg/node:lts

cache-key: &cache-key
  key: dependency-cache-primary-{{ arch }}-yarn-packages-{{ checksum ".nvmrc" }}-{{ checksum "yarn.lock" }}

commands:
  enable_corepack:
    steps:
      - run:
          name: Enable Corepack
          # Makes `yarn` resolve to the version declared in `packageManager`. Installed into the user
          # prefix because the image's global bin directory is not writable.
          command: |
            mkdir -p "$HOME/.local/bin"
            corepack enable --install-directory "$HOME/.local/bin"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

  yarn_install:
    steps:
      - restore_cache: *cache-key
      - enable_corepack
      - vault/get-secrets:
          template-preset: 'semantic-release'
      - run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_PACKAGES_READ_TOKEN}" > ~/.npmrc
          echo "@contentful:registry=https://npm.pkg.github.com" >> ~/.npmrc
      - run: yarn install --immutable
      - save_cache:
          <<: *cache-key
          paths:
            - ~/.yarn/berry/cache

jobs:
  lint:
    executor: linux-node
    steps:
      - checkout
      - yarn_install
      - run: yarn lint
      # Yarn 4 does not run the root `prepublish` on install, so the packages are built before the
      # type check resolves them.
      - run: yarn build
      - run: yarn tsc
  unit-tests:
    executor: linux-node
    steps:
      - checkout
      - yarn_install
      - run: yarn build
      - run: yarn test:ci

  release:
    executor: linux-node
    steps:
      - checkout
      - vault/get-secrets:
          template-preset: 'semantic-release'
      - yarn_install
      - vault/configure-lerna
      - run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_PACKAGES_WRITE_TOKEN}" > ~/.npmrc
          echo "@contentful:registry=https://npm.pkg.github.com" >> ~/.npmrc
      - run: yarn build # This should not be needed, but without it it will not contain any files
      - run: yarn lerna version --no-private --conventional-commits --create-release github --yes
      - run: yarn lerna publish from-git --yes

  prerelease:
    executor: linux-node
    steps:
      - checkout
      - vault/get-secrets:
          template-preset: 'semantic-release'
      - yarn_install
      - vault/configure-lerna
      - run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_PACKAGES_WRITE_TOKEN}" > ~/.npmrc
          echo "@contentful:registry=https://npm.pkg.github.com" >> ~/.npmrc
      - run: yarn build # This should not be needed, but without it it will not contain any files
      - run: yarn lerna version --no-private --conventional-commits --create-release github --yes --exact --conventional-prerelease
      - run: yarn lerna publish from-git --yes --canary

workflows:
  version: 2
  # run on every commit
  commit:
    jobs:
      - lint:
          context: vault
      - unit-tests:
          context: vault
      - prerelease:
          context: vault
          filters:
            branches:
              only: canary
          requires:
            - lint
            - unit-tests
      - release:
          context: vault
          filters:
            branches:
              only: main
          requires:
            - lint
            - unit-tests
